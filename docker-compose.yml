# Zstock 编排：web（Flask+gunicorn） + mysql
# 凭据统一放 .env（gitignored，install-docker.sh 生成，chmod 600）
#
#   docker compose up -d          启动
#   docker compose exec web python run_pipeline.py   手动跑一期
#   docker compose logs -f web    看日志

services:
  web:
    build: .
    image: zstock-web:latest
    container_name: zstock-web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-zstock}
      DB_USER: ${MYSQL_USER:-zstock}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SF_URL_PREFIX: /forecast
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 400m
    networks:
      - zstock

  mysql:
    image: mysql:8.0
    container_name: zstock-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zstock}
      MYSQL_USER: ${MYSQL_USER:-zstock}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql-tuning.cnf:/etc/mysql/conf.d/zstock-tuning.cnf:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    networks:
      - zstock

volumes:
  mysql_data:
    name: zstock_mysql_data

networks:
  zstock:
    name: zstock_net
