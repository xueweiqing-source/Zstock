<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}预测分析平台{% endblock %}</title>
<style>
* { box-sizing: border-box; }
body { margin:0; background:#f4f6f7; color:#1c2833; font-family:"Microsoft YaHei","PingFang SC",sans-serif; font-size:14px; line-height:1.65; }
.topbar { background:#1a5276; color:#fff; padding:0 20px; display:flex; align-items:center; gap:24px; height:52px; }
.topbar .brand { font-size:16px; font-weight:600; }
.topbar a { color:#d6eaf8; text-decoration:none; font-size:13.5px; padding:6px 2px; }
.topbar a:hover { color:#fff; }
.topbar a.active { color:#fff; border-bottom:2px solid #fff; }
.topbar .right { margin-left:auto; font-size:12.5px; color:#aed6f1; }
.wrap { max-width:1180px; margin:0 auto; padding:22px 16px 56px; }
.card { background:#fff; border:1px solid #e5e8e8; border-radius:10px; padding:22px 26px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
h1 { font-size:22px; margin:0 0 8px; color:#1a5276; }
h2 { font-size:17px; margin:0 0 14px; padding-left:10px; border-left:4px solid #1a5276; color:#1a5276; }
h3 { font-size:14.5px; margin:16px 0 8px; color:#2c3e50; }
.meta { color:#5d6d7e; font-size:12.5px; }
table { width:100%; border-collapse:collapse; margin:10px 0; font-size:13px; }
th, td { border:1px solid #d5dbdb; padding:8px 10px; text-align:left; vertical-align:top; }
th { background:#eaf2f8; color:#1a5276; font-weight:600; white-space:nowrap; }
tr:nth-child(even) td { background:#fbfcfc; }
tr.clickable:hover td { background:#eaf2f8; cursor:pointer; }
.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
.tag { display:inline-block; background:#eaf2f8; color:#1a5276; border-radius:4px; padding:1px 8px; font-size:12px; margin:2px 4px 2px 0; }
.badge { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px; font-weight:600; color:#fff; }
.bull { background:#c0392b; } .bear { background:#1e8449; } .flat { background:#5d6d7e; }
.conf { display:inline-block; padding:2px 8px; border-radius:8px; border:1px solid #7f8c8d; color:#5d6d7e; font-size:12px; }
.conf-高 { border-color:#1a5276; color:#1a5276; } .conf-中 { border-color:#b9770e; color:#b9770e; }
.kpi-row { display:flex; flex-wrap:wrap; gap:12px; margin:12px 0; }
.kpi { flex:1 1 150px; background:#f8f9f9; border:1px solid #e5e8e8; border-radius:8px; padding:12px 14px; }
.kpi .v { font-size:22px; font-weight:700; color:#1a5276; }
.kpi .k { font-size:12px; color:#7f8c8d; }
.up { color:#c0392b; } .down { color:#1e8449; } .muted { color:#7f8c8d; }
ul.factors { margin:6px 0; padding-left:20px; } ul.factors li { margin:4px 0; }
.callout { background:#fef9e7; border-left:4px solid #d4ac0d; padding:10px 14px; border-radius:4px; margin:10px 0; }
.callout.risk { background:#fdedec; border-left-color:#c0392b; }
.disclaimer { background:#f8f9f9; border:1px solid #d5dbdb; border-radius:8px; padding:14px 18px; color:#566573; font-size:12.5px; line-height:1.8; }
.bar-wrap { background:#ecf0f1; border-radius:4px; height:10px; overflow:hidden; }
.bar-fill { background:#1a5276; height:100%; }
.layer-score { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
.layer-box { flex:1 1 180px; border:1px solid #e5e8e8; border-radius:8px; padding:12px 14px; background:#fbfcfc; }
.layer-box .lv { font-size:12px; color:#7f8c8d; }
.layer-box .sv { font-size:20px; font-weight:700; }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">预测分析平台</span>
  <a href="{{ prefix }}/" class="{{ 'active' if active=='dashboard' else '' }}">总览</a>
  <a href="{{ prefix }}/runs" class="{{ 'active' if active=='runs' else '' }}">报告中心</a>
  <a href="{{ prefix }}/backtest" class="{{ 'active' if active=='backtest' else '' }}">回测与准确率</a>
  <a href="{{ prefix }}/settings" class="{{ 'active' if active=='settings' else '' }}">规则与研判</a>
  <span class="right">用户 {{ session.get('sf_user','') }} · <a href="{{ prefix }}/logout" style="color:#d6eaf8">退出</a></span>
</div>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
