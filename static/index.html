<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zstock 预测分析平台</title>
<link rel="stylesheet" href="static/js/bundle.css">
<style>
  html, body, #app { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
  .layout { min-height: 100vh; }
  .sider { background: #001529; overflow: auto; }
  .logo { height: 56px; display: flex; align-items: center; padding: 0 20px; color: #fff; font-size: 15px; font-weight: 600; letter-spacing: .3px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .logo .mark { width: 22px; height: 22px; margin-right: 10px; border-radius: 4px; background: #1677ff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
  .header { background: #fff; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,21,41,.08); z-index: 10; }
  .content { margin: 16px; padding: 20px; background: #fff; border-radius: 4px; min-height: calc(100vh - 56px - 56px); }
  .page-title { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .page-desc { color: rgba(0,0,0,.45); font-size: 13px; margin: 0 0 16px; }
  .stat-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .stat-item { flex: 1 1 150px; padding: 14px 16px; background: #fafafa; border: 1px solid #f0f0f0; border-radius: 4px; }
  .stat-item .label { font-size: 12px; color: rgba(0,0,0,.45); margin-bottom: 6px; }
  .stat-item .value { font-size: 22px; font-weight: 600; color: rgba(0,0,0,.88); line-height: 1.2; }
  .stat-item .value.pos { color: #cf1322; }
  .stat-item .value.neg { color: #389e0d; }
  .stat-item .sub { font-size: 11px; color: rgba(0,0,0,.35); margin-top: 4px; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f2f5; }
  .login-card { width: 380px; padding: 32px 32px 20px; background: #fff; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .login-title { font-size: 18px; font-weight: 600; text-align: center; margin-bottom: 2px; }
  .login-sub { text-align: center; color: rgba(0,0,0,.45); font-size: 13px; margin-bottom: 24px; }
  .login-foot { text-align: center; color: rgba(0,0,0,.3); font-size: 11px; margin-top: 20px; }
  .report-frame { width: 100%; min-height: 70vh; border: 1px solid #f0f0f0; border-radius: 4px; }
  .mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; }
  .link { color: #1677ff; cursor: pointer; }
  .link:hover { text-decoration: underline; }
  /* ===== 市场概览 ===== */
  .market-section { padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
  .market-section:last-child { border-bottom: none; padding-bottom: 4px; }
  .market-hd { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .market-label { font-size: 13px; font-weight: 600; color: rgba(0,0,0,.75); position: relative; padding-left: 8px; }
  .market-label::before { content: ''; position: absolute; left: 0; top: 2px; bottom: 2px; width: 3px; background: #1677ff; border-radius: 2px; }
  .market-turnover { font-size: 12px; color: rgba(0,0,0,.55); }
  .market-turnover b { color: rgba(0,0,0,.85); font-size: 14px; font-weight: 600; margin: 0 2px; }
  .turnover-split { color: rgba(0,0,0,.4); margin-left: 4px; }
  .index-grid { display: flex; gap: 12px; flex-wrap: wrap; }
  .index-item {
    flex: 1 1 0; min-width: 130px; max-width: 200px;
    padding: 10px 12px 8px;
    background: #fafafa; border: 1px solid #f0f0f0; border-radius: 6px;
  }
  .index-name { font-size: 12px; color: rgba(0,0,0,.55); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .index-price { font-size: 18px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .index-row { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
  .index-chg { font-size: 12px; font-variant-numeric: tabular-nums; }
  .index-pct { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .index-amt { font-size: 11px; color: rgba(0,0,0,.38); margin-top: 3px; }
  .c-up { color: #cf1322; } .c-down { color: #389e0d; } .c-flat { color: rgba(0,0,0,.65); }
  .breadth-wrap { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding: 8px 12px; background: #fafafa; border-radius: 6px; }
  .breadth-track { flex: 1; height: 10px; border-radius: 5px; overflow: hidden; display: flex; background: #f0f0f0; }
  .breadth-up { background: #cf1322; height: 100%; }
  .breadth-flat { background: #d9d9d9; height: 100%; }
  .breadth-down { background: #389e0d; height: 100%; }
  .breadth-text { font-size: 12px; color: rgba(0,0,0,.55); white-space: nowrap; }
  .global-block { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 10px; }
  .global-block:last-child { margin-bottom: 0; }
  .global-tag { flex: 0 0 56px; font-size: 12px; color: rgba(0,0,0,.55); padding-top: 12px; }
  .global-block .index-grid { flex: 1; }
</style>
</head>
<body>
<div id="app"></div>
<script src="static/js/bundle.js"></script>
</body>
</html>
