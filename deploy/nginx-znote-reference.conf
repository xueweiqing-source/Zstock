server {
    listen 80;
    server_name _;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/znote;
    index index.html;

    client_max_body_size 10m;
# [2026-10-08] 路书站点已下线，如需恢复：删除本块，恢复下方备份文件
# 备份：/etc/nginx/conf.d/znote.conf.bak_20261008101710
location = /travel { return 404; }
location ^~ /travel/ {
    return 404;
}

    # [2026-10-27] Znote 前端已下线。恢复：把 return 404 改回 try_files $uri $uri/ /index.html; 后重载 nginx
    # 备份：/etc/nginx/conf.d/znote.conf.bak_stopfe_20261027142748
    location / {
        return 404;
    }

    # 旧上传路径不得回退到前端单页应用
    location ^~ /uploads/ {
        return 404;
    }

    # 图片不再公开静态托管，统一走后端鉴权 /api/uploads/files/
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000;
        access_log off;
    }

    # [2026-10-27] Znote 前端静态资源同步下线
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

# 追加到 /etc/nginx/conf.d/znote.conf 的 server{} 块内
# 挂载点：/forecast/  →  本地 Flask(127.0.0.1:8501)
# 健康检查（无需鉴权）

# 健康检查（无需鉴权）

# stock-forecast 服务已停用（2026-10-19）

location = /forecast {
    return 301 /forecast/;
}

location ^~ /forecast/ {
    proxy_pass http://127.0.0.1:8501/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /forecast;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_redirect off;
}

# 健康检查（无需鉴权）
location = /forecast/healthz {
    proxy_pass http://127.0.0.1:8501/healthz;
    proxy_set_header Host $host;
    access_log off;
}

}
