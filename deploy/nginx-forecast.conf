# 追加到 /etc/nginx/conf.d/znote.conf 的 server{} 块内
# 挂载点：/forecast/  →  本地 Flask(127.0.0.1:8501)

# 无尾斜杠时补上，避免落到 znote 站点
location = /forecast {
    return 301 /forecast/;
}

location ^~ /forecast/ {
    proxy_pass http://127.0.0.1:8501/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /forecast;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_redirect off;
}

# 健康检查（无需鉴权）
location = /forecast/healthz {
    proxy_pass http://127.0.0.1:8501/healthz;
    proxy_set_header Host $host;
    access_log off;
}
